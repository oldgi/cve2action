# CVE2Action Decision Rules —— **幾何平均版本**，僅供 Day 23 的形式比較
#
# 與 config/risk_rules.yaml 只差一個 `form`。權重在幾何平均裡當成指數使用
# （指數和為 1，所以它是加權幾何平均，不是乘法）。
# 這個檔不是 production 設定；哪一種勝出由 calibrate 與 acceptance 決定。
#
# CVE2Action Decision Rules v0.1（baseline，不是標準答案）
#
# 依據：docs/articles/day-05.md 與 docs/decisions/ADR-day-05-decision-engine-v01.md
# - 權重與映射外部化於此檔，不 hard-code；變更權重或門檻須新增/更新 ADR
# - UNKNOWN 控制不得降低曝險（不知道，就不能假裝已有防護）
# - Priority Score 僅用於排序與驗證，不宣稱事故機率或財務損失
version: "0.4.0-geometric"

# 從 NVD 快照取 CVSS 時的版本偏好（Day 8，ADR-day-08）。
# 先 3.1：與 Day 5 建立的驗收基準可比；只有 4.0 的 CVE 才退用 4.0。
# 兩版分數不做換算，輸出一律標明 cvss_version。
cvss:
  version_preference: ["3.1", "4.0"]

# Priority Score = 10 × (severity×S + threat×T + exposure×E + business×B)，權重和必須為 1
#
# Day 14 加入 threat。權重從 severity 挪出來，因為 CVSS 的可利用性指標本來就跟
# 「實際會不會被利用」部分重疊——沒有威脅資料時由 severity 一個人兼著，有了就該分開。
# 0.35/0.15/0.25/0.25 是 v0.1 的起始假設，Day 17、18 校準後可能改，改就要更新 ADR。
# Day 23 加入路徑項 A（藍圖 §9.3）。A 的權重 0.20 取自 §9.5 的指數，
# 其餘四項按比例縮 0.80 倍——不重新討論相對關係，只讓出 A 需要的空間。
# 沒有路徑分數時 A 整項移除、權重退回 exposure：兩者是同一件事的兩個尺度，
# exposure 問「這台暴露多少」，path 問「從外面走得到嗎」。
weights:
  severity: 0.28   # S = CVSS / 10
  threat: 0.12     # T = max(EPSS 對數轉換, KEV)
  exposure: 0.20   # E = Reachability × Control Effectiveness
  business: 0.20   # B = Business Impact
  path: 0.20       # A = 0.40·可達 + 0.25·權限 + 0.25·Crown Jewel + 0.10·跳數

# 合成形式：additive（加權算術平均，v0.1 baseline）或 geometric（藍圖 §9.5 的加權幾何平均）。
# 兩者的取捨在 Day 23 以 calibrate 與 acceptance 的輸出決定，不以論述決定。見 ADR-day-23。
form: geometric

# 威脅正規化（Day 14，ADR-day-14）
threat:
  # EPSS 原始機率極度偏斜，對數轉換把低端拉開：ln(1 + base·p) / ln(1 + base)
  epss_log_base: 99
  # KEV 已收錄＝已確認被實際利用，給滿分；與 EPSS 取大不取平均
  kev_listed_value: 1.0
  # 完全沒有威脅資料時，threat 的權重退回 severity（不按比例分給所有項目）：
  # CVSS 的可利用性指標本來就兼著回答「會不會被利用」，沒有 EPSS/KEV 時它繼續兼，
  # 公式因此退回 Day 5 的 50/25/25，先前建立的基準不受影響。
  fallback_weight_to: severity

# Zone → Reachability（Day 12，ADR-day-12）。
# Zone 是行政標籤，不是觀測到的可達性——這張表是「在沒有更好資料前」的假設，
# 有實際觀測時以觀測為準（Day 20 的 Reachability Engine 會取代它）。
exposure:
  zone_reachability:
    DMZ: INTERNET
    APP: INTERNAL
    DATA: INTERNAL
    CORP: INTERNAL
    MGMT: INTERNAL
    OT: ISOLATED
    LAB: ISOLATED
  # 控制證據的有效天數。過期不代表控制失效，但不能再拿它打折（降為 UNKNOWN）。
  control_evidence_max_age_days: 90

# 控制措施的適用範圍（Day 15，ADR-day-15）。
#
# 一項控制要能折減風險，得先證明它的攔截點落在這條攻擊路徑上：調校過的 WAF 攔不到
# 本機的 sudo 提權，管理員 MFA 攔不到不需要驗證的 Netlogon 繞過。判斷只用 CVSS 向量裡
# 兩個可查證的欄位，不另外發明欄位：
#   AV —— 攻擊從哪裡來；PR —— 這條路徑上有沒有「驗證」這一關（PR:N 代表沒有）。
# 判斷結果為三態：適用（套用強度）、不適用（已知攔不到，不折減）、無法判斷（同樣不折減）。
#
# 網段隔離對 AV:L 標為不適用，不是說隔離沒用——「誰到得了這台機器」已經由
# Reachability 算過一次了，再從 Control 扣一次是同一項控制在同一條公式裡算兩次。
controls:
  applicability:
    waf:
      attack_vectors: [NETWORK]           # 只看得到送進來的應用層請求
    network_segmentation:
      attack_vectors: [NETWORK, ADJACENT_NETWORK]
    edr:
      attack_vectors: [NETWORK, ADJACENT_NETWORK, LOCAL, PHYSICAL]  # 端點上的行為都看得到
    mfa:
      attack_vectors: [NETWORK, ADJACENT_NETWORK]
      requires_authentication: true       # 攻擊不必驗證就走得到時，MFA 沒有位置可站
    mfa_admin_tiering:
      attack_vectors: [NETWORK, ADJACENT_NETWORK, LOCAL]
      requires_authentication: true

# 業務衝擊（Day 13，ADR-day-13）。criticality 不再手標，由三項可查證的事實推導：
# 存什麼資料、多久不能停、是否直接面對客戶。多個維度取最嚴重的一個——
# 一台存放受管制資料的機器，就算停機容忍度很高，外洩的衝擊仍在。
business_impact:
  data_class:
    RESTRICTED: CRITICAL      # 受法規或合約管制
    CONFIDENTIAL: IMPORTANT   # 內部機密
    INTERNAL: NORMAL
    PUBLIC: NORMAL
    NONE: NORMAL              # 不存業務資料
  # 恢復時間目標：多久之內非復原不可
  rto_hours:
    - { within: 4, criticality: CRITICAL }
    - { within: 24, criticality: IMPORTANT }
  rto_beyond: NORMAL
  # 直接面對客戶的系統，停機立刻被外部看見，至少 IMPORTANT
  customer_facing_floor: IMPORTANT

reachability:
  INTERNET: 1.0
  INTERNAL: 0.6
  ISOLATED: 0.2

# 殘餘攻擊面的「序」，不是攔截成功率——沒有人能宣稱一個 WAF 攔得下六成攻擊。
# 每一級綁在可查證的證據門檻上，證據等級決定係數，不是由感覺決定：
#   STRONG  —— 有針對此攻擊類別的阻擋證據（negative test、bypass test）
#   PARTIAL —— 只有偵測、或規則未針對此應用調校，沒有阻擋證據
#   NONE    —— 沒有控制，或現有控制對這條攻擊路徑不適用
#   UNKNOWN —— 有控制但拿不出證據
# 折減上限刻意壓在 0.4：最強的控制最多把單筆 finding 往下移一個分級，不可能靠一項
# 補償控制把 Critical 直接壓成 Medium（10×0.25×0.6=1.5 分 < 跨兩級所需的 2.01 分）。
# 這條性質有回歸測試守著；三個數字本身要到 Day 17 用人工排序校準。
control_effectiveness:
  NONE: 1.0
  PARTIAL: 0.7
  STRONG: 0.4
  UNKNOWN: 1.0   # 必須 >= NONE，載入時強制檢查

business_criticality:
  CRITICAL: 1.0
  IMPORTANT: 0.7
  NORMAL: 0.4

# label 是內部刻度（0–10，Day 5 以來所有基準都用它）；tier 是對外呈現的處置層級，
# 語彙與藍圖 §9.5 一致，讓 §9.6 的覆寫規則（「至少 P0」）之後寫得出來。
#
# 門檻沿用 9.0/7.0/4.0，**不採用藍圖的 80/60/35**。那組門檻是為 CRPS 乘法模型訂的，
# 乘法會把分數拉得很開；我們的加法分數結構上有地板（實測落在 56–100），把 80/60/35
# 搬過來會得到 38 筆裡 21 筆 P0——而 P0 的定義是「緊急評估與處理」，21 件緊急等於沒有緊急。
# 門檻與公式是一對，只搬一半會壞掉。詳見 ADR-day-18-crps-tier-mapping。
priority_bands:
  - { label: Critical, tier: P0, floor: 9.0, ceiling: 10.0, action: 緊急評估與處理 }
  - { label: High,     tier: P1, floor: 7.0, ceiling: 8.99, action: 納入下一個修補窗口 }
  - { label: Medium,   tier: P2, floor: 4.0, ceiling: 6.99, action: 排程處理或補強控制 }
  - { label: Low,      tier: P3, floor: 0.0, ceiling: 3.99, action: 監控、接受或定期複核 }
