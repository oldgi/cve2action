# Decision Engine v0.1 評分門檻（Day 18，ADR-day-18）
#
# 「可用」不是感覺排得還行，是一組量得出來的條件。這個檔定義那組條件；
# `cve2action acceptance` 逐條量，`scripts/` 與 CI 每次都跑。
#
# 兩件事要先講清楚：
#
# 1. **門檻分兩種**。structural 是公式本身的性質，用合成探針驗證，與任何資料集無關；
#    empirical 是在某個資料集上量出來的，換資料集就會變。把兩者混在一起，
#    就會像我從 Day 11 到 Day 17 一樣，把「這個資料集沒有那種組合」誤判成「公式壞了」。
#
# 2. **沒過不一定要修**。沒過而且沒有 waiver，exit 1。沒過但有 waiver，要寫清楚
#    為什麼現在不修、根因是什麼、哪一天重新量。選擇不修是決定，不是忽略。

version: "0.2.0"
applies_to_rules_version: "0.4.0"

criteria:
  # --- structural：公式的性質，用合成探針驗證 -------------------------------
  - id: bands_reachable
    kind: structural
    description: 四個分級都必須構造得出來，否則有一級是裝飾
    threshold: all

  - id: degradation_safe
    kind: structural
    description: 缺資料不得讓分數變低——不知道不能換來比較安全的名次
    threshold: all

  - id: monotonic
    kind: structural
    description: 任一因子單獨變大，分數不得下降
    threshold: all

  # --- empirical：在 Northstar 上量出來的 -----------------------------------
  - id: explainable
    kind: empirical
    description: 每一筆評分都要有完整因子分解、每項因子有來源，且分解重建得出分數
    threshold: 1.0

  # Day 23 新增。Day 16 做 `gap_to` 的理由是「排序是比較出來的，單看一列的算式
  # 永遠答不了為什麼它在第三名而不是第二名」——那是這個專案對外最核心的承諾，
  # 而 Day 18 定八條門檻時漏了它。補一條門檻看守它，不是為了今天的公式決策加碼。
  - id: attributable
    kind: empirical
    description: 每一組相鄰名次都要能逐項說明誰贏在哪一項，且逐項差額加得回總分差
    threshold: 1.0

  - id: discrimination
    kind: empirical
    description: 相異分數佔評分筆數的比例；太低代表排序分不開
    threshold: 0.70

  - id: band_balance
    kind: empirical
    description: 單一分級不得超過評分筆數的這個比例；過度集中等於沒有分級
    threshold: 0.50
    direction: at_most

  - id: range_coverage
    kind: empirical
    description: 實際分數跨距佔 0–10 的比例；太窄代表刻度沒被用到
    threshold: 0.60

  - id: ceiling_saturation
    kind: empirical
    description: 分數撞到 10.0 的比例上限；常撞頂端就失去解析度
    threshold: 0.05
    direction: at_most

# 沒通過但現在不修的，必須在這裡說明。沒有 waiver 的失敗會讓 acceptance exit 1。
waivers:
  - id: band_balance
    measured: 0.5263
    reason: >
      38 筆裡 20 筆是 High（Day 18 是 24 筆）。路徑項把它從 63% 拉到 53%，
      方向對了，但還是過半。根因沒變：B 只有三檔（1.0／0.7／0.4）、E 實際只取到
      五個值，輸入本身的解析度就這麼粗，輸出不可能比輸入細。
      要再攤開就得改值域映射，而那會讓 Day 5 到 Day 18 的每一個回歸基準同時失效。
    revisit_on: "2026-10-12"
    revisit_because: >
      Day 18 的這條豁免寫的是 `revisit_on: Day 20`——那是一句話，不是到期日，
      程式只檢查它非空，所以它實際上是永久豁免（Day 23 發現並修掉）。
      新的日子對應 Day 28 的排名實作：屆時處置模型會引入「不必修」這個第一級結論，
      一批 finding 會離開分級分母，分布會再變一次。那時重新量。

  - id: range_coverage
    measured: 0.443
    reason: >
      實際分數落在 5.43–9.86，用掉 0–10 的 44.3%——Day 18 是 44%，**幾乎沒有改善**。
      Day 18 的豁免當時押的是「Day 20 的可達性引擎會讓 E 變寬，跨距自然拉開」。
      那個預測錯了，而且錯在前提：Day 20 之後我們沒有把觀測到的連線塞回 E，
      而是另外開了第五項 path。E 的值域一個都沒有變。
      地板也還在：B 最低 0.4、E 最低 0.08、A 最低 0.05 乘上 0.4 的子權重。
    revisit_on: "2026-10-12"
    revisit_because: >
      同上，Day 28。這一次不預測結果——Day 18 的預測落空，就是因為它預測了
      一個還沒做的設計會怎麼影響一個還沒量的數字。
