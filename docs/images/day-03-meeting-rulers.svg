<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150"><rect width="1500" height="1150" fill="#fcfbf8"/><g font-family="Noto Sans TC, sans-serif"><text x="70" y="65" font-size="24" fill="#68758a" font-weight="600">CVE2Action  /  DAY 03</text><text x="70" y="143" font-size="52" fill="#203149" font-weight="800">同一場會議，大家拿的是同一把尺嗎？</text><text x="70" y="196" font-size="28" fill="#68758a" font-weight="400">聽懂對方提供了什麼，再問還缺哪一塊。</text><rect x="60" y="240" width="1380" height="196" rx="22" fill="white" stroke="#dce2e8" stroke-width="2"/><rect x="60" y="240" width="12" height="196" rx="6" fill="#b84348"/><text x="100" y="305" font-size="39" fill="#203149" font-weight="700">「9.8，很嚴重，快修！」</text><rect x="1030" y="265" width="375" height="55" rx="27" fill="#fff3f2"/><text x="1052" y="303" font-size="29" fill="#b84348" font-weight="700">嚴重度尺</text><text x="100" y="380" font-size="31" fill="#b84348" font-weight="600">接著問 → 知道洞很嚴重，還要問：攻擊有多現實？</text><rect x="60" y="460" width="1380" height="196" rx="22" fill="white" stroke="#dce2e8" stroke-width="2"/><rect x="60" y="460" width="12" height="196" rx="6" fill="#aa710a"/><text x="100" y="525" font-size="39" fill="#203149" font-weight="700">「外面已經有人在利用了！」</text><rect x="1030" y="485" width="375" height="55" rx="27" fill="#fff8e9"/><text x="1052" y="523" font-size="29" fill="#aa710a" font-weight="700">威脅尺</text><text x="100" y="600" font-size="31" fill="#aa710a" font-weight="600">接著問 → 知道有人在打，還要問：我們的入口與條件成立嗎？</text><rect x="60" y="680" width="1380" height="196" rx="22" fill="white" stroke="#dce2e8" stroke-width="2"/><rect x="60" y="680" width="12" height="196" rx="6" fill="#236d7a"/><text x="100" y="745" font-size="39" fill="#203149" font-weight="700">「我們有 WAF、ACL 和 RBAC。」</text><rect x="1030" y="705" width="375" height="55" rx="27" fill="#edf7f7"/><text x="1052" y="743" font-size="29" fill="#236d7a" font-weight="700">風險評估的材料</text><text x="100" y="820" font-size="31" fill="#236d7a" font-weight="600">接著問 → 知道有防護，還要問：擋住哪一段？證據在哪裡？</text><rect x="60" y="925" width="1380" height="146" rx="18" fill="#203149"/><text x="100" y="980" font-size="35" fill="white" font-weight="700">三句話都提供資訊，但還沒完成同一個風險判斷。</text><text x="100" y="1031" font-size="30" fill="#dbe5ef" font-weight="400">把入口、控制證據與可能損失接起來，才能討論怎麼處理。</text><text x="70" y="1110" font-size="24" fill="#68758a" font-weight="400">有防護 ≠ 已證明有效　｜　有利用 ≠ 本機已失守　｜　高分數 ≠ 完整風險判斷</text></g></svg>