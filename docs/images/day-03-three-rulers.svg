<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100"><rect width="1500" height="1100" fill="#fcfbf8"/><g font-family="Noto Sans TC, sans-serif"><text x="70" y="65" font-size="24" fill="#68758a" font-weight="600">CVE2Action  /  DAY 03</text><text x="70" y="143" font-size="52" fill="#203149" font-weight="800">嚴重度看漏洞，威脅看攻擊，風險看我們。</text><text x="70" y="196" font-size="28" fill="#68758a" font-weight="400">收到弱掃通知時，先問這三個問題。</text><rect x="60" y="238" width="1380" height="206" rx="22" fill="#fff3f2" stroke="#b84348" stroke-width="1.5"/><rect x="85" y="264" width="44" height="154" rx="6" fill="#b84348"/><path d="M85 276h23" stroke="white" stroke-width="2"/><path d="M85 288h13" stroke="white" stroke-width="2"/><path d="M85 300h13" stroke="white" stroke-width="2"/><path d="M85 312h23" stroke="white" stroke-width="2"/><path d="M85 324h13" stroke="white" stroke-width="2"/><path d="M85 336h13" stroke="white" stroke-width="2"/><path d="M85 348h23" stroke="white" stroke-width="2"/><path d="M85 360h13" stroke="white" stroke-width="2"/><path d="M85 372h13" stroke="white" stroke-width="2"/><path d="M85 384h23" stroke="white" stroke-width="2"/><path d="M85 396h13" stroke="white" stroke-width="2"/><path d="M85 408h13" stroke="white" stroke-width="2"/><text x="153" y="280" font-size="22" fill="#b84348" font-weight="700">01</text><text x="153" y="331" font-size="43" fill="#b84348" font-weight="800">嚴重度</text><text x="153" y="386" font-size="36" fill="#203149" font-weight="700">看漏洞</text><path d="M350 266v150" stroke="#b84348" opacity=".25"/><text x="385" y="301" font-size="35" fill="#203149" font-weight="700">怎麼利用？成功後有多嚴重？</text><text x="385" y="356" font-size="29" fill="#203149" font-weight="400">壞鎖怎麼打得開，打開後能做什麼？</text><text x="385" y="407" font-size="25" fill="#b84348" font-weight="600">技術條件與衝擊</text><rect x="60" y="464" width="1380" height="206" rx="22" fill="#fff8e9" stroke="#aa710a" stroke-width="1.5"/><rect x="85" y="490" width="44" height="154" rx="6" fill="#aa710a"/><path d="M85 502h23" stroke="white" stroke-width="2"/><path d="M85 514h13" stroke="white" stroke-width="2"/><path d="M85 526h13" stroke="white" stroke-width="2"/><path d="M85 538h23" stroke="white" stroke-width="2"/><path d="M85 550h13" stroke="white" stroke-width="2"/><path d="M85 562h13" stroke="white" stroke-width="2"/><path d="M85 574h23" stroke="white" stroke-width="2"/><path d="M85 586h13" stroke="white" stroke-width="2"/><path d="M85 598h13" stroke="white" stroke-width="2"/><path d="M85 610h23" stroke="white" stroke-width="2"/><path d="M85 622h13" stroke="white" stroke-width="2"/><path d="M85 634h13" stroke="white" stroke-width="2"/><text x="153" y="506" font-size="22" fill="#aa710a" font-weight="700">02</text><text x="153" y="557" font-size="43" fill="#aa710a" font-weight="800">威脅</text><text x="153" y="612" font-size="36" fill="#203149" font-weight="700">看攻擊</text><path d="M350 492v150" stroke="#aa710a" opacity=".25"/><text x="385" y="527" font-size="35" fill="#203149" font-weight="700">攻擊有多現實？</text><text x="385" y="582" font-size="29" fill="#203149" font-weight="400">有開鎖工具、行竊活動，或有人盯上我們嗎？</text><text x="385" y="633" font-size="25" fill="#aa710a" font-weight="600">工具、活動與對象</text><rect x="60" y="690" width="1380" height="206" rx="22" fill="#edf7f7" stroke="#236d7a" stroke-width="1.5"/><rect x="85" y="716" width="44" height="154" rx="6" fill="#236d7a"/><path d="M85 728h23" stroke="white" stroke-width="2"/><path d="M85 740h13" stroke="white" stroke-width="2"/><path d="M85 752h13" stroke="white" stroke-width="2"/><path d="M85 764h23" stroke="white" stroke-width="2"/><path d="M85 776h13" stroke="white" stroke-width="2"/><path d="M85 788h13" stroke="white" stroke-width="2"/><path d="M85 800h23" stroke="white" stroke-width="2"/><path d="M85 812h13" stroke="white" stroke-width="2"/><path d="M85 824h13" stroke="white" stroke-width="2"/><path d="M85 836h23" stroke="white" stroke-width="2"/><path d="M85 848h13" stroke="white" stroke-width="2"/><path d="M85 860h13" stroke="white" stroke-width="2"/><text x="153" y="732" font-size="22" fill="#236d7a" font-weight="700">03</text><text x="153" y="783" font-size="43" fill="#236d7a" font-weight="800">風險</text><text x="153" y="838" font-size="36" fill="#203149" font-weight="700">看我們</text><path d="M350 718v150" stroke="#236d7a" opacity=".25"/><text x="385" y="753" font-size="35" fill="#203149" font-weight="700">在我們這裡，多可能出事、會傷到哪裡？</text><text x="385" y="808" font-size="29" fill="#203149" font-weight="400">小偷接近得了嗎？門後有什麼，還能去哪裡？</text><text x="385" y="859" font-size="25" fill="#236d7a" font-weight="600">可能性與損失</text><rect x="60" y="943" width="1380" height="76" rx="16" fill="#203149"/><text x="96" y="992" font-size="35" fill="#ffffff" font-weight="600">前兩把提供線索，第三把把線索放回我們的環境。</text><text x="70" y="1060" font-size="24" fill="#68758a" font-weight="400">記住三個問題，比背下三個名詞更有用。　｜　概念教學，非三組分數相乘</text></g></svg>