[project]
name = "cve2action"
version = "0.2.0"
description = "從 CVE 堆到修補優先序：可解釋的弱點修補決策引擎（2026 iThome 鐵人賽）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
cve2action = "cve2action.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cve2action"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Day 2 資料檢查腳本先於本設定存在；只放寬風格類規則，不放寬正確性檢查
"scripts/validate_day02.py" = ["E501", "B905"]
