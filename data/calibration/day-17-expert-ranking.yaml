# Day 17 校準基準：人工排序
#
# 方法：只看漏洞身分、CVSS 向量與資產事實（zone、業務角色、資料分類、RTO、
# 是否面對客戶、有無控制），**不看任何模型分數**，由人排出處置先後並寫下理由。
# 這份檔案在跑模型之前就 commit，commit 時間戳是它沒有被事後調整的唯一證據。
#
# 效度威脅（必須寫在這裡，不是寫在附註）：
#   排序者與模型作者是同一個人。這不是獨立驗證，是作者的自我一致性檢查。
#   真正的校準需要不只一位、且沒參與建模的人。在只有一個人的專案裡，能做到的
#   最誠實版本就是：先封存判斷，再對照，分歧一律寫下來，不回頭改排序。
#
# 用途：`cve2action calibrate` 讀這個檔與模型輸出做比較；任何一對順序不一致
# 而沒有對應的 resolutions 條目，測試就會失敗（藍圖 Day 17 驗收：差異都有書面解釋）。

version: "1.0.0"
authored_on: "2026-10-03"
ranked_by: "作者本人（同時是模型作者——見上方效度威脅）"
scenario_as_of: "2026-09-24"
method: facts-only-then-compare

findings:
  - rank: 1
    asset: NS-APP-BILLING-01
    cve: CVE-2023-34362
    label: MOVEit Transfer 未驗證 RCE
    facts: "AV:N/PR:N 免驗證；APP 區；RESTRICTED 受管制資料；RTO 4h；無任何控制"
    rationale: >
      免驗證遠端執行，打在存放受管制資料的計費系統上，而且這個 CVE 在真實世界是
      被勒索集團大規模自動化利用的那一類。三件事同時成立：打得到、打得穿、打穿了
      會出事。沒有理由不排第一。

  - rank: 2
    asset: NS-EDGE-RTR-01
    cve: CVE-2023-20198
    label: Cisco IOS XE WebUI 權限提升
    facts: "AV:N/PR:N 免驗證；DMZ；資料分類 NONE；RTO 1h；無控制"
    rationale: >
      這台機器自己不存任何業務資料，但它是所有流量的入口。拿下邊界路由器等於拿到
      通往內部的路。RTO 1 小時代表業務端也知道它不能停。我把「它是別人的前置條件」
      看得比「它自己存什麼」重。

  - rank: 3
    asset: NS-DB-CUSTOMER-01
    cve: CVE-2021-3156
    label: sudo Baron Samedit 本機提權
    facts: "AV:L 需先在機器上；DATA 區；Crown Jewel；RESTRICTED；RTO 2h；網段隔離 STRONG"
    rationale: >
      AV:L 代表它是第二階段漏洞，攻擊者得先進得來。但一旦進來，這一步就是整台
      客戶資料庫的 root。我把它排在兩個免驗證 RCE 之後、但在實驗室機器之前——
      Crown Jewel 上的提權，和一台沒資料的機器上的 RCE 不是同一個量級。

  - rank: 4
    asset: NS-LAB-CONFLUENCE-01
    cve: CVE-2022-26134
    label: Confluence OGNL 免驗證 RCE
    facts: "AV:N/PR:N 免驗證；LAB 區（隔離）；資料分類 NONE；RTO 168h；無控制"
    rationale: >
      技術上最好打的一個——免驗證、有公開武器化利用。但它在隔離的實驗室區、不存
      業務資料、停一週也沒人有感。它值得修，但不值得插隊到計費系統前面。
      這一筆是刻意放進來測模型會不會被「名氣大的 CVE」帶著走。

  - rank: 5
    asset: NS-PLC-DC-ENV
    cve: CVE-2024-6242
    label: ControlLogix 控制器
    facts: "OT 區（隔離）；資料分類 NONE；RTO 2h；無控制；Day 13 推導為 CRITICAL"
    rationale: >
      機房空調的 PLC。RTO 2 小時不是裝飾——冷卻停擺整個機房會跟著停。但它在隔離
      的 OT 網段，沒有已知的可達路徑，而且這類攻擊需要的前置條件遠多於前面四筆。
      排最後，但這是五筆裡我最不確定的一筆：如果 Day 20 的可達性分析發現 OT 區
      其實從 CORP 進得去，這個判斷就該翻掉。

# 跑完模型後填寫。每一對順序不一致都必須在這裡有一條，否則測試失敗。
resolutions: []
