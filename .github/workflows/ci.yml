name: CI

on:
  push:
    branches: ["main", "feature/**", "chore/**", "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Validate Day 2 static fixtures
        run: uv run python scripts/validate_day02.py

      - name: Validate data contracts
        run: uv run python scripts/validate_schemas.py

      - name: Smoke run decision engine on day-06 sample
        run: >
          uv run cve2action rank
          --scanner data/synthetic/day-06-scanner.csv
          --context data/synthetic/day-06-asset-context.csv
          --rules config/risk_rules.yaml
          --out ranked_result.csv

      # 以下兩步守住「文件寫的完整流程真的跑得起來」，與開發規格 §7 的指令逐字對應。
      - name: Derive asset context from facts (Northstar)
        run: >
          uv run cve2action derive-context
          --assets data/synthetic/northstar/assets.csv
          --controls data/synthetic/northstar/controls.csv
          --business data/synthetic/northstar/business_context.csv
          --rules config/risk_rules.yaml --as-of 2026-09-24
          --out data/synthetic/northstar/asset_context.csv

      - name: Full-chain run with snapshots, threat intel and controls (Northstar)
        run: >
          uv run cve2action rank
          --scanner data/synthetic/northstar/scanner.csv
          --context data/synthetic/northstar/asset_context.csv
          --rules config/risk_rules.yaml
          --snapshots data/snapshots/nvd
          --epss data/snapshots/epss
          --kev data/snapshots/kev
          --controls data/synthetic/northstar/controls.csv
          --as-of 2026-09-24
          --out ranked_result.csv

      # Day 17／18 的兩道閘門：校準分歧必須有書面解釋、評分門檻沒過必須有 waiver。
      - name: Calibration against the frozen expert ranking
        run: >
          uv run cve2action calibrate
          --scanner data/synthetic/northstar/scanner.csv
          --context data/synthetic/northstar/asset_context.csv
          --rules config/risk_rules.yaml
          --snapshots data/snapshots/nvd
          --epss data/snapshots/epss
          --kev data/snapshots/kev
          --controls data/synthetic/northstar/controls.csv
          --as-of 2026-09-24
          --assets data/synthetic/northstar/assets.csv
          --interfaces data/synthetic/northstar/asset_interfaces.csv
          --services data/synthetic/northstar/services.csv
          --network data/synthetic/northstar/network_edges.csv
          --identity data/synthetic/northstar/identity_edges.csv
          --policies data/synthetic/northstar/network_policies.csv
          --findings data/synthetic/northstar/scanner.csv
          --baseline data/calibration/day-17-expert-ranking.yaml

      # 這個 gate 不給 --today，所以用的是真正的今天。豁免的 revisit_on 一到
      # （目前是 2026-10-12），CI 就會紅——那是設計，不是故障：到期的豁免不是豁免。
      # 看到它紅，動作是重新量測並重新說明，不是把日期往後推。
      #
      # 路徑項自 Day 23 進入公式。不給攻擊圖輸入，引擎會把該項整個移除——
      # 那會量到一個**不是 production 的模型**：門檻與 tau 都還是綠的，
      # 但綠的是上一版。兩個 gate 都必須餵同一組圖資料。
      - name: Scoring acceptance gate
        run: >
          uv run cve2action acceptance
          --scanner data/synthetic/northstar/scanner.csv
          --context data/synthetic/northstar/asset_context.csv
          --rules config/risk_rules.yaml
          --criteria config/acceptance.yaml
          --snapshots data/snapshots/nvd
          --epss data/snapshots/epss
          --kev data/snapshots/kev
          --controls data/synthetic/northstar/controls.csv
          --as-of 2026-09-24
          --assets data/synthetic/northstar/assets.csv
          --interfaces data/synthetic/northstar/asset_interfaces.csv
          --services data/synthetic/northstar/services.csv
          --network data/synthetic/northstar/network_edges.csv
          --identity data/synthetic/northstar/identity_edges.csv
          --policies data/synthetic/northstar/network_policies.csv
          --findings data/synthetic/northstar/scanner.csv

      # 推導與評分都離線，重跑必須得到與版控完全相同的結果；
      # 有任何差異就代表快照、規則或推導邏輯動了而沒有一起更新資料集。
      - name: Committed dataset must be reproducible
        run: git diff --exit-code -- data/synthetic/northstar/
